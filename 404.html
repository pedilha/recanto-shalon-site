<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, follow" />
  <title>Página não encontrada | Recanto Shalon Eventos</title>
  <meta name="description" content="A página que você procura não foi encontrada. Volte para o site do Recanto Shalon Eventos em Aparecida de Goiânia." />

  <link rel="canonical" href="https://recantoshaloneventos.com.br/404.html" />
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />

  <style>
    .error-page {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: var(--vinho-deep);
      position: relative;
      overflow: hidden;
      padding: 2rem 1.25rem;
    }

    .error-page::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: var(--grain);
      background-repeat: repeat;
      opacity: var(--grain-opacity);
      mix-blend-mode: overlay;
    }

    .error-inner {
      position: relative;
      z-index: 2;
      max-width: 480px;
    }

    .error-logo {
      height: 44px;
      margin-bottom: 2.5rem;
    }

    .error-code {
      font-family: var(--font-display);
      font-weight: 300;
      font-size: clamp(4rem, 14vw, 7rem);
      line-height: 1;
      color: var(--gold-light);
      margin-bottom: 0.5rem;
    }

    .error-title {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: clamp(1.5rem, 4vw, 2rem);
      color: var(--white);
      margin-bottom: 1rem;
    }

    .error-desc {
      font-size: 0.95rem;
      color: rgba(253, 250, 245, 0.7);
      line-height: 1.7;
      margin-bottom: 2.25rem;
    }

    .error-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
    }
  </style>
</head>
<body>
  <section class="error-page">
    <div class="error-inner">
      <img src="logo.png" alt="Recanto Shalon Eventos" class="error-logo" />
      <p class="error-code" aria-hidden="true">404</p>
      <h1 class="error-title">Essa página não existe</h1>
      <p class="error-desc">
        O endereço que você tentou acessar não foi encontrado. Pode ter sido movido ou o link
        está incorreto — mas o resto do site continua de pé.
      </p>
      <div class="error-actions">
        <a href="/" class="btn btn-gold">Voltar para o início</a>
        <a href="https://wa.me/5562982705533?text=Ol%C3%A1!%20Gostaria%20de%20solicitar%20um%20or%C3%A7amento%20para%20meu%20evento%20no%20Recanto%20Shalon.%20Pode%20me%20ajudar%3F"
           target="_blank" rel="noopener noreferrer" class="btn btn-outline">Falar no WhatsApp</a>
      </div>
    </div>
  </section>
</body>
</html>
